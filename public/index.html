<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Session Generator</title>
  <style>
    body {
      background-color: #111;
      font-family: "Comic Sans MS", cursive, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    h1 {
      color: #39ff14;
      margin-bottom: 20px;
      font-size: 2.5em;
    }

    input[type="text"] {
      padding: 12px;
      font-size: 18px;
      border: 2px solid #00bfff;
      border-radius: 8px;
      margin-bottom: 20px;
      width: 280px;
      background-color: #222;
      color: #fff;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      background-color: #00bfff;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px #00bfff, 0 0 20px #00bfff;
      transition: 0.3s ease;
    }

    button:hover {
      background-color: #0080ff;
      box-shadow: 0 0 20px #0080ff, 0 0 30px #0080ff;
      color: #fff;
    }

    #message {
      margin-top: 20px;
      font-size: 20px;
      color: #00ffea;
    }

    #pair-code {
      margin-top: 10px;
      font-size: 24px;
      color: #ff66ff;
      font-weight: bold;
    }

    footer {
      position: absolute;
      bottom: 20px;
      font-size: 20px;
      color: #39ff14;
    }
  </style>
</head>
<body>
  <h1>Generate WhatsApp Session</h1>
  <input type="text" id="phone" placeholder="Enter phone number" />
  <button onclick="startSession()">Start Session</button>
  <div id="message"></div>
  <div id="pair-code"></div>

  <footer>Powered by Samuel</footer>

  <script>
    async function startSession() {
      const phone = document.getElementById('phone').value;
      const res = await fetch('/start-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone })
      });

      const data = await res.json();
      const messageDiv = document.getElementById('message');
      const pairDiv = document.getElementById('pair-code');

      if (data.sessionId) {
        messageDiv.textContent = `Session started! ID: ${data.sessionId}`;
        if (data.pairCode) {
          pairDiv.textContent = `PAIR CODE: ${data.pairCode}`;
        } else {
          pairDiv.textContent = 'Waiting for pair code...';
        }
      } else {
        messageDiv.textContent = `Error: ${data.error}`;
        pairDiv.textContent = '';
      }
    }
  </script>
</body>
</html>
