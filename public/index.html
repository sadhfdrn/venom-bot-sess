<!DOCTYPE html>
<html>
<head>
  <title>WPPConnect Pair Code</title>
</head>
<body>
  <h2>Enter Phone Number to Start Pairing</h2>
  <input type="text" id="phone" placeholder="e.g. 5511999999999" />
  <button onclick="sendPhone()">Start Session</button>
  <p id="result"></p>

  <script>
    async function sendPhone() {
      const phone = document.getElementById('phone').value;
      const res = await fetch('/pair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone })
      });
      const data = await res.json();
      document.getElementById('result').innerText = data.sessionId
        ? 'Session ID sent to your WhatsApp!'
        : 'Failed to start session.';
    }
  </script>
</body>
</html>
